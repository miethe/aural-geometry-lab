# .claude/aos-artifacts.yaml — Aural Geometry Lab (AGL)
#
# Per-project artifact manifest: the JOIN/STATE table the dev-execution provisioning gate
# (hooks/provision-artifacts.sh) is BINDING-GATED on. An artifact absent from this file is
# invisible to the gate even when the gate runs.
#
# THIS FILE IS THE package.json OF THE AOS ARTIFACT LAYER. The directories it describes —
# .claude/{skills,agents,commands,workflows,hooks} — are the node_modules: gitignored,
# reproducible, never hand-edited. Edit an artifact at its UPSTREAM
# (agentic_meta_dev/docs/ARTIFACT-UPSTREAM-REGISTRY.md), never the deployed copy here.
# The committed companions are .claude/.skillmeat-deployed.toml (the lockfile, with content
# hashes) and .claude/settings.json.
#
# REPROVISION A FRESH CLONE — deploy artifacts INDIVIDUALLY, not via the bundle:
#   set -a; . ~/.config/aos/secrets.env; set +a
#   export SKILLMEAT_EDITION=enterprise
#   skillmeat deploy <name> --type <skill|agent|command|orchestration|hook> --project .
# `skillmeat bundle deploy aos-workflow-set-v4.1` is NOT a working provision path today; see below.
#
# KNOWN DEPLOY DEFECTS as of 2026-08-18 (filed against the skillmeat IntentTree tree).
# Do not treat a clean `bundle deploy` as a working provision until these close:
#   node_01M0BSDQ8SKJMK5BVGSSDNESMB  bundle deploy writes orchestrations to a NON-RESOLVING
#                                    .claude/orchestration/<name>/<name>.js
#   node_01M0BSE6PRJDBF651PTJ5NVSD0  bundle deploy records NOTHING in .skillmeat-deployed.toml,
#                                    which makes `skillmeat project reconcile` refuse every
#                                    artifact at gate row 6 (unknown provenance, fail-closed)
#   node_01M0BSQNJZ1CQXN7YGBR6TXMDB  command:execute-plan/execute-contract/explore/spike serve
#                                    orchestration .js; the four marked tuned:true below are
#                                    hand-placed from the pinned v4.1 snapshot as a result
#   node_01M0BSFKG0NBNX400Y7EJ5569N  the bundle omits reviewer-gate
#   node_01M0BSFJWRTVZG0SKMZFVN6HEM  bundle content is older than catalog latest for 4/7 workflows
#   node_01M0BSENGDCTD98KX48YNVCW44  skillmeat init/register resolve to a PARENT manifest
#   node_01M0BT9JSPPHAZ3T6X68SKYJYK  command deploy has no namespace concept, so commands land
#                                    FLAT here (/autopilot) where the launchpad has /dev:autopilot
#
