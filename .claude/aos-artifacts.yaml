# .claude/aos-artifacts.yaml — Aural Geometry Lab (AGL)
#
# Per-project artifact manifest: the JOIN/STATE table the dev-execution provisioning gate
# (hooks/provision-artifacts.sh) is BINDING-GATED on. An artifact absent from this file is
# invisible to the gate even when the gate runs.
#
# THIS FILE IS THE package.json OF THE AOS ARTIFACT LAYER. The deployed directories it
# describes — .claude/skills, .claude/agents, .claude/commands, .claude/workflows — are the
# node_modules: gitignored, reproducible, never hand-edited. Edit an artifact at its UPSTREAM
# (docs/ARTIFACT-UPSTREAM-REGISTRY.md in agentic_meta_dev), never the deployed copy here.
#
# Reprovision a fresh clone with:
#   set -a; . ~/.config/aos/secrets.env; set +a
#   SKILLMEAT_EDITION=enterprise skillmeat bundle deploy aos-workflow-set-v4.1 --project .
#   # then see KNOWN DEPLOY DEFECTS below — the bundle alone does NOT produce a working set.
#
# KNOWN DEPLOY DEFECTS as of 2026-08-18 (filed against the skillmeat tree; do not
# treat a clean `bundle deploy` as a working provision until these close):
#   node_01M0BSDQ8SKJMK5BVGSSDNESMB  bundle deploy writes orchestrations to a NON-RESOLVING
#                                    .claude/orchestration/<name>/<name>.js — deploy each
#                                    orchestration individually to get .claude/workflows/<name>.js
#   node_01M0BSE6PRJDBF651PTJ5NVSD0  bundle deploy records NOTHING in .skillmeat-deployed.toml
#   node_01M0BSQNJZ1CQXN7YGBR6TXMDB  command:execute-plan/execute-contract/explore/spike serve
#                                    orchestration .js — the four marked tuned:true below are
#                                    hand-placed from the pinned v4.1 snapshot as a result
#   node_01M0BSFKG0NBNX400Y7EJ5569N  the bundle omits reviewer-gate
#   node_01M0BSFJWRTVZG0SKMZFVN6HEM  bundle content is older than catalog latest for 4/7 workflows
#   node_01M0BSENGDCTD98KX48YNVCW44  skillmeat init/register resolve to a PARENT manifest
#
